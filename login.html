<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>

body{
    background:#111;
    font-family:Arial;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    background:#222;
    padding:40px;
    border-radius:10px;
    text-align:center;
}

input{
    width:250px;
    padding:10px;
    margin:10px;
    border:none;
    border-radius:5px;
}

button{
    background:#ff3b3b;
    color:white;
    padding:10px 20px;
    border:none;
    border-radius:20px;
    cursor:pointer;
}

button:hover{
    background:#e60023;
}

</style>
</head>

<body>

<div class="login-box">

<h2>Login</h2>

<form>
<input type="text" placeholder="Username"><br>
<input type="password" placeholder="Password"><br>
<button type="submit">Login</button>
</form>

</div>

</body>
</html>
