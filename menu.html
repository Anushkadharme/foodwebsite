   <!DOCTYPE html>
<html>
<head>
<title>Food Menu</title>

<style>
body{
    font-family: Arial, sans-serif;
    background-color:#f8f8f8;
    margin:0;
}

header{
    background-color:#ff4d4d;
    color:white;
    text-align:center;
    padding:20px;
}

.menu-container{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    padding:20px;
}

.menu-item{
    background:white;
    width:250px;
    margin:15px;
    border-radius:10px;
    box-shadow:0 4px 8px rgba(0,0,0,0.2);
    text-align:center;
    padding:15px;
}

.menu-item img{
    width:100%;
    height:150px;
    border-radius:10px;
}

.menu-item h3{
    margin:10px 0;
}

.price{
    color:green;
    font-size:18px;
    font-weight:bold;
}

button{
    background-color:#ff4d4d;
    color:white;
    border:none;
    padding:10px 20px;
    margin-top:10px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background-color:#cc0000;
}
</style>

</head>

<body>

<header>
<h1>Our Food Menu</h1>
<p>Choose your favorite food</p>
</header>

<div class="menu-container">

<div class="menu-item">
<img src="pizza.jpg" alt="Pizza">
<h3>Cheese Pizza</h3>
<p class="price">₹250</p>
<button onclick="location.href='order.html'">Order Now</button>
</div>

<div class="menu-item">
<img src="burger.jpg" alt="Burger">
<h3>Veg Burger</h3>
<p class="price">₹120</p>
<button onclick="location.href='order.html'">Order Now</button>
</div>

<div class="menu-item">
<img src="pasta.jpg" alt="Pasta">
<h3>White Sauce Pasta</h3>
<p class="price">₹180</p>
<button onclick="location.href='order.html'">Order Now</button>
</div>

<div class="menu-item">
<img src="fries.jpg" alt="Fries">
<h3>French Fries</h3>
<p class="price">₹90</p>
<button onclick="location.href='order.html'">Order Now</button>
</div>

</div>

</body>
</html>
