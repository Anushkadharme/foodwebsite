<!DOCTYPE html>
<html>
<head>
<title>Pizza Deals</title>

<style>

body{
    font-family:Arial;
    background:#111;
    color:white;
    text-align:center;
}

h1{
    margin-top:40px;
}

.deals-container{
    display:flex;
    justify-content:center;
    gap:30px;
    margin-top:40px;
}

.deal-box{
    background:#222;
    padding:20px;
    border-radius:10px;
    width:200px;
}

button{
    background:#ff3b3b;
    color:white;
    padding:10px 20px;
    border:none;
    border-radius:20px;
    cursor:pointer;
}

button:hover{
    background:#e60023;
}

</style>
</head>

<body>

<h1>Today's Pizza Deals</h1>

<div class="deals-container">

<div class="deal-box">
<h3>Buy 1 Get 1 Free</h3>
<p>Order any medium pizza and get one free.</p>
<button>Order Now</button>
</div>

<div class="deal-box">
<h3>Family Combo</h3>
<p>2 Large Pizza + Coke at ₹499</p>
<button>Order Now</button>
</div>

<div class="deal-box">
<h3>Cheese Burst Offer</h3>
<p>Extra cheese pizza only ₹199</p>
<button>Order Now</button>
</div>

</div>

</body>
</html>
