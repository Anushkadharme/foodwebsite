<!DOCTYPE html>
<html>
<head>
<title>Contact Us</title>

<style>

body{
    font-family: Arial;
    background:#111;
    color:white;
    text-align:center;
}

.contact-box{
    background:#222;
    width:400px;
    margin:auto;
    margin-top:100px;
    padding:30px;
    border-radius:10px;
}

input, textarea{
    width:90%;
    padding:10px;
    margin:10px;
    border:none;
    border-radius:5px;
}

button{
    background:#ff3b3b;
    color:white;
    padding:10px 20px;
    border:none;
    border-radius:20px;
    cursor:pointer;
}

button:hover{
    background:#e60023;
}

</style>
</head>

<body>

<div class="contact-box">

<h2>Contact Us</h2>

<form>

<input type="text" placeholder="Your Name"><br>

<input type="email" placeholder="Your Email"><br>

<textarea placeholder="Your Message"></textarea><br>

<button type="submit">Send Message</button>

</form>

</div>

</body>
</html>
