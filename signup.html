<!DOCTYPE html>
<html>
<head>
<title>Signup</title>

<style>

body{
    background:#111;
    font-family:Arial;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.signup-box{
    background:#222;
    padding:40px;
    border-radius:10px;
    text-align:center;
}

input{
    width:250px;
    padding:10px;
    margin:10px;
    border:none;
    border-radius:5px;
}

button{
    background:#ff3b3b;
    color:white;
    padding:10px 20px;
    border:none;
    border-radius:20px;
    cursor:pointer;
}

button:hover{
    background:#e60023;
}

</style>
</head>

<body>

<div class="signup-box">

<h2>Signup</h2>

<form>

<input type="text" placeholder="Full Name"><br>

<input type="email" placeholder="Email"><br>

<input type="password" placeholder="Password"><br>

<input type="password" placeholder="Confirm Password"><br>

<button type="submit">Signup</button>

</form>

</div>

</body>
</html>
