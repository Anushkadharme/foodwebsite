<!DOCTYPE html>
<html>
<head>
    <title>Order Page</title>

    <style>
        form {
            background: white;
            color: black;
            width: 400px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
        }

        button {
            background: red;
            color: white;
            padding: 10px;
            border: none;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>

</head>

<body>

<h2>Order Details</h2>

<form onsubmit="placeOrder(event)">
    <label>Your Name</label>
    <input type="text" required>

    <label>Phone Number</label>
    <input type="text" required>

    <label>Delivery Address</label>
    <textarea required></textarea>

    <h3>Select Payment Method</h3>
    <input type="radio" name="payment"> Cash on Delivery<br>
    <input type="radio" name="payment"> UPI Payment<br>
    <input type="radio" name="payment"> Card<br>

    <button type="submit">Place Order</button>
</form>

<script>
function placeOrder(event) {
    event.preventDefault(); // page reload stop karega
    alert("Order Placed Successfully ✅");
}
</script>

</body>
</html>
