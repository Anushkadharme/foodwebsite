<!DOCTYPE html>
<html>
<head>
<title>View Menu</title>

<style>
body{
font-family: Arial;
background:#f5f5f5;
}

h2{
text-align:center;
}

table{
width:90%;
margin:auto;
border-collapse:collapse;
background:white;
}

th, td{
padding:10px;
border:1px solid #ddd;
text-align:center;
}

th{
background:#ff4d4d;
color:white;
}
</style>

</head>

<body>

<h2>Menu Table</h2>

<table id="menuTable">
<tr>
<th>Username</th>
<th>Item Name</th>
<th>Price</th>
<th>Mobile</th>
<th>Location</th>
<th>Payment</th>
</tr>
</table>

<script>
let data = [
{
username:"Anushka",
item:"Cheese Pizza",
price:"250",
mobile:"9876543210",
location:"Nagpur",
payment:"Cash on Delivery"
},
{
username:"Rahul",
item:"Veg Pizza",
price:"200",
mobile:"9123456780",
location:"Pune",
payment:"UPI"
},
{
username:"Sneha",
item:"Burger",
price:"120",
mobile:"9988776655",
location:"Mumbai",
payment:"Cash on Delivery"
},
{
username:"Amit",
item:"Paneer Pizza",
price:"300",
mobile:"9876501234",
location:"Delhi",
payment:"Cash on Delivery"
}
];

let table = document.getElementById("menuTable");

data.forEach(item => {
table.innerHTML += `
<tr>
<td>${item.username}</td>
<td>${item.item}</td>
<td>₹${item.price}</td>
<td>${item.mobile}</td>
<td>${item.location}</td>
<td>${item.payment}</td>
</tr>
`;
});
</script>

</body>
</html>
