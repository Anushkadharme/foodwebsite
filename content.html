<!DOCTYPE html>
<html>
<head>
<title>Contact Us</title>

<style>
/* Smooth scrolling enable karne ke liye */
html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial;
    background: #111;
    color: white;
    text-align: center;
}

.contact-box {
    background: #222;
    width: 400px;
    margin: auto;
    margin-top: 100px;
    padding: 30px;
    border-radius: 10px;
    /* Header ke peeche na chhupne ke liye margin */
    scroll-margin-top: 100px; 
}

input, textarea {
    width: 90%;
    padding: 10px;
    margin: 10px;
    border: none;
    border-radius: 5px;
}

button {
    background: #ff3b3b;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    width: 95%; /* Button ko thoda bada karne ke liye */
}

button:hover {
    background: #e60023;
}
</style>
</head>

<body>

<div class="contact-box" id="contact-section">

    <h2>Contact Us</h2>

    <form>
        <p style="text-align: left; margin-left: 20px;">Your Name</p>
        <input type="text" placeholder="Enter your name"><br>

        <p style="text-align: left; margin-left: 20px;">Your Email</p>
        <input type="email" placeholder="Enter your email"><br>

        <p style="text-align: left; margin-left: 20px;">Your Message</p>
        <textarea placeholder="Enter your message" rows="4"></textarea><br>

        <button type="submit">Send Message</button>
    </form>

</div>

</body>
</html>
