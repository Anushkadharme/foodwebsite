<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .contact-box {
            background: #222;
            width: 400px;
            margin: auto;
            margin-top: 100px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(255, 255, 255, 0.1);
        }

        input, textarea {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            outline: none;
        }

        button {
            width: 96%;
            padding: 12px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background-color: #ff6b81;
        }
    </style>
</head>
<body>

    <div class="contact-box">
        <h1>Contact Us</h1>
        <form>
            <input type="text" placeholder="Apna Naam Likhein" required>
            <input type="email" placeholder="Apni Email ID" required>
            <textarea placeholder="Message yahan likhein..." rows="5" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </div>

</body>
</html>
